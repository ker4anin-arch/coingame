{% extends 'base.html' %}

{% block title %}Умения — PCoin{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Умения</h1>
    <div class="coin-badge">
        <img src="/static/images/coin.png" alt="Coin">
        <span>50,000</span>
    </div>
</div>

<div class="tabs">
    <button class="tab-btn active" onclick="filterSkills('all', this)">Все</button>
    <button class="tab-btn" onclick="filterSkills('product', this)">Продукт</button>
    <button class="tab-btn" onclick="filterSkills('brand', this)">Бренд</button>
    <button class="tab-btn" onclick="filterSkills('health', this)">Здоровье</button>
    <button class="tab-btn" onclick="filterSkills('wealth', this)">Состояние</button>
</div>

<div class="skills-grid" id="skills-grid">
    {% for skill in skills %}
    <div class="skill-card" data-category="{{ skill.category }}">
        <div class="skill-card-icon">
            <i class="fas {{ skill.icon }}"></i>
        </div>
        <div class="skill-card-name">{{ skill.name }}</div>
        <div class="skill-card-income">
            +<span>{{ skill.income }}</span>/час
        </div>
        <div class="skill-card-footer">
            <span class="skill-level-badge">Lvl {{ skill.level }}</span>
            <div class="skill-cost">
                <img src="/static/images/coin.png" alt="coin">
                <span>{{ skill.cost }}</span>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

<script>
function filterSkills(category, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.skill-card').forEach(card => {
        const show = category === 'all' || card.dataset.category === category;
        card.style.display = show ? 'flex' : 'none';
    });
}
</script>
{% endblock %}
